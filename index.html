<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Getting to Know You 💜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one question per screen, narrow centered column, big tappable answers */
:root {
  --bg: #F6F2FA;
  --surface: #FFFFFF;
  --ink: #231A2E;
  --muted: #6B5E7B;
  --accent: #6B2FB0;
  --accent-ink: #FFFFFF;
  --line: #DDD2EA;
  --soft: #EDE3F7;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17101F; --surface: #221830; --ink: #F1EAF8; --muted: #A99BBB;
    --accent: #B58CF0; --accent-ink: #1A1026; --line: #3A2C4D; --soft: #2D2040;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17101F; --surface: #221830; --ink: #F1EAF8; --muted: #A99BBB;
  --accent: #B58CF0; --accent-ink: #1A1026; --line: #3A2C4D; --soft: #2D2040;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
h1, h2 { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: 40px; }
h2 { font-size: 27px; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.progress { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 14px 16px; font: inherit; cursor: pointer; min-height: 56px;
}
.opt .l {
  flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--soft); color: var(--accent); font-weight: 600; font-size: 14px;
}
.opt.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.opt.on .l { background: var(--accent-ink); color: var(--accent); }
.opt:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
label.own { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
textarea { min-height: 260px; resize: vertical; font-size: 15px; line-height: 1.5; }
.nav { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; border-radius: 12px; padding: 14px 20px; cursor: pointer; text-align: center;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink); text-decoration: none;
  flex: 1 1 140px; min-height: 52px; display: inline-flex; align-items: center; justify-content: center;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.status { font-size: 14px; color: var(--muted); min-height: 1.4em; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
@media (max-width: 420px) { h1 { font-size: 34px; } h2 { font-size: 24px; } }
</style>

<main id="app"></main>

<script>
var QS = [
 ["Sweet and playful","What did you think the first time you saw me?",["“Who is she?”","“I need to talk to her”","“Is she real?”","Something else"]],
 ["Sweet and playful","What do you like most about my voice?",["It’s soft and calm","It makes me smile","I could listen to it all day","Everything about it"]],
 ["Sweet and playful","What was the best part of our last moment together?",["The conversation","The laughs","The vibe","All of it"]],
 ["Sweet and playful","Which nickname would you give me?",["Sweetie","Princess","Habibti","My own idea"]],
 ["Sweet and playful","What do I do that makes you smile without me noticing?",["My messages","My jokes","My voice","Just thinking about me"]],
 ["Flirty","What would I wear to make you lose focus?",["An elegant dress","Anything purple","Something casual and natural","Honestly, anything"]],
 ["Flirty","If I showed up at your door tonight, you would...",["Give me a big smile and a hug","Cook for me","Put on a movie","Be speechless"]],
 ["Flirty","Your perfect evening with me is...",["Slow and romantic","A wild surprise","A mix of both","Depends on the mood"]],
 ["Flirty","How do you like to be teased?",["With playful jokes","With sweet compliments","With a cheeky message","I’m a diplomat, I don’t get teased"]],
 ["Flirty","What do you keep thinking about when it comes to me?",["My smile","My voice","My energy","My personality"]],
 ["Normal life","How was your day, really?",["Great, no complaints","Busy but good","Long and tiring","Better now that you asked"]],
 ["Normal life","What’s the most boring part of your job?",["Long meetings","Paperwork","Travel delays","Waiting for people"]],
 ["Normal life","What do you eat when you’re stressed?",["Jollof rice","Suya","Something sweet","Nothing, I just sleep"]],
 ["Normal life","What are you most proud of that nobody talks about?",["My family","Helping people","My faith","My hard work"]],
 ["Fun and faith","What’s your funniest Ramadan or Eid memory?",["Someone falling asleep at iftar","A cooking disaster","Eid outfit drama","Too many to choose from"]],
 ["Flirty","What’s your favourite part of my body?",["My face","My tummy","My nyash","All of me"]],
 ["The future, lightly","If you had the possibility, where would you take me for a trip, just us two?",["The Maldives","Dubai","Kribi beach","A surprise destination"]],
 ["The future, lightly","What would make you feel you’ve succeeded as a dad?",["My kids are happy","My kids are well educated","My kids are strong in their faith","All of the above"]],
 ["The future, lightly","Do you know your genotype?",["AA","AS","SS","Not sure yet"]],
 ["The future, lightly","What do you want us to do together before the year ends?",["A romantic dinner","A weekend trip","A long night of talking","Surprise me"]]
];
var N = QS.length, LET = ["A","B","C","D"];
var step = -1;
var ans = QS.map(function(){ return { choice: null, other: "" }; });
var app = document.getElementById("app");

function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === "text") e.textContent = attrs[k];
    else if (k === "class") e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
function answerText(i) {
  var a = ans[i];
  if (a.other.trim()) return a.other.trim();
  return a.choice === null ? "" : QS[i][2][a.choice];
}
function go(s) { step = s; render(); window.scrollTo(0, 0); }

function intro() {
  app.replaceChildren(
    el("p", { class: "eyebrow", text: "A small quiz, just for you" }),
    el("h1", { text: "Getting to Know You" }),
    el("p", { class: "muted", text: "Maryam made you 20 short questions, about five minutes. Tap the answer that fits you best, or write your own." }),
    el("p", { class: "muted", text: "At the end you can send your answers back to her." }),
    el("div", { class: "nav" }, [ btn("Start", "btn", function () { go(0); }) ])
  );
}
function btn(label, cls, fn) { var b = el("button", { type: "button", class: cls, text: label }); b.addEventListener("click", fn); return b; }

function question() {
  var i = step, q = QS[i], a = ans[i];
  var opts = el("div", { class: "opts" });
  var nextBtn;
  function refresh() {
    Array.prototype.forEach.call(opts.children, function (b, k) { b.classList.toggle("on", a.choice === k); b.setAttribute("aria-pressed", a.choice === k ? "true" : "false"); });
    nextBtn.disabled = !answerText(i);
  }
  q[2].forEach(function (t, k) {
    var b = el("button", { type: "button", class: "opt" }, [ el("span", { class: "l", text: LET[k] }), el("span", { text: t }) ]);
    b.addEventListener("click", function () { a.choice = k; a.other = ""; own.value = ""; refresh(); });
    opts.appendChild(b);
  });
  var own = el("input", { type: "text", id: "own-" + i, maxlength: "200", placeholder: "Write your own answer" });
  own.value = a.other;
  own.addEventListener("input", function () { a.other = own.value; if (own.value.trim()) a.choice = null; refresh(); });
  var last = i === N - 1;
  nextBtn = btn(last ? "See my answers" : "Next", "btn", function () { go(last ? N : i + 1); });
  var back = btn("Back", "btn ghost", function () { go(i === 0 ? -1 : i - 1); });
  app.replaceChildren(
    el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(N), "aria-valuenow": String(i + 1) }, [ (function () { var d = el("div"); d.style.width = ((i + 1) / N * 100) + "%"; return d; })() ]),
    el("p", { class: "eyebrow", text: "Question " + (i + 1) + " of " + N + " · " + q[0] }),
    el("h2", { text: q[1] }),
    opts,
    el("label", { class: "own", for: "own-" + i }, [ el("span", { text: "Or type something else" }), own ]),
    el("div", { class: "nav" }, [ back, nextBtn ])
  );
  refresh();
}

function summaryText() {
  var lines = ["Getting to Know You — my answers 💜", ""];
  QS.forEach(function (q, i) { lines.push((i + 1) + ". " + q[1]); lines.push("→ " + answerText(i)); lines.push(""); });
  return lines.join("\n").trim();
}
function summary() {
  var text = summaryText();
  var ta = el("textarea", { id: "msg", readonly: "readonly", "aria-label": "Your answers" });
  ta.value = text;
  var status = el("p", { class: "status", role: "status" });
  var wa = el("a", { class: "btn", href: "https://wa.me/?text=" + encodeURIComponent(text), target: "_blank", rel: "noopener", text: "Send on WhatsApp" });
  var copy = btn("Copy my answers", "btn ghost", function () {
    function fallback() { ta.focus(); ta.select(); status.textContent = "Select and copy the text above, then paste it in your chat."; }
    try {
      navigator.clipboard.writeText(text).then(function () { status.textContent = "Copied. Paste it in your chat with Maryam."; }, fallback);
    } catch (e) { fallback(); }
  });
  app.replaceChildren(
    el("p", { class: "eyebrow", text: "All " + N + " answered" }),
    el("h2", { text: "Thank you. Now send them to Maryam." }),
    el("p", { class: "muted", text: "Tap the WhatsApp button, choose her chat and press send. Or copy the answers and paste them wherever you talk." }),
    el("div", { class: "card" }, [ ta, el("div", { class: "nav" }, [ wa, copy ]), status ]),
    el("div", { class: "nav" }, [ btn("Change an answer", "btn ghost", function () { go(0); }) ])
  );
}
function render() { if (step < 0) intro(); else if (step >= N) summary(); else question(); }
render();
</script>

</body></html>
